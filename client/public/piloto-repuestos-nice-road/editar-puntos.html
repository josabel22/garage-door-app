<!doctype html><html lang="es"><head><script>try { const user=JSON.parse(localStorage.getItem('mg_user')||'null'); const allowed=window.parent!==window && typeof window.parent.hasReportDiagramPilotAccess==='function' ? window.parent.hasReportDiagramPilotAccess() : String(user?.username||'').trim().toLowerCase()==='admin'; if(!allowed)location.replace('../..'); } catch (_) { location.replace('../..'); }</script><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>MG Portones | Ajustar puntos Nice ROAD</title><style>:root{--navy:#123654;--blue:#23608f;--line:#d4e0eb;--bg:#eef3f7;--orange:#e27413;--red:#a93030}*{box-sizing:border-box}body{margin:0;color:#172b3d;background:var(--bg);font-family:Arial,sans-serif}.shell{width:min(1160px,100%);margin:auto;padding:20px}header{padding:20px;color:#fff;background:var(--navy);border-radius:10px}h1{margin:0;font-size:27px}header p{margin:7px 0 0;color:#d8e8f4}.panel{margin-top:16px;padding:17px;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 8px 24px rgba(17,54,84,.08)}.tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.tools label{font-weight:700}.tools select{min-height:42px;padding:8px;border:1px solid #aebfcd;border-radius:7px;font:inherit}button{border:0;border-radius:7px;padding:11px 14px;background:var(--blue);color:#fff;font:inherit;font-weight:800;cursor:pointer}button.danger{background:var(--red)}.help{margin:14px 0 0;padding:11px 13px;border-left:4px solid #e3a21c;background:#fff7df;line-height:1.45}.canvas{position:relative;margin-top:16px;overflow:auto;border:1px solid #c5d5e2;border-radius:8px;background:#fff;line-height:0}.stage{position:relative;min-width:680px}.stage img{display:block;width:100%;height:auto}.marker{position:absolute;width:26px;height:26px;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;background:var(--orange);box-shadow:0 1px 4px #3458;color:#fff;font:800 11px Arial;cursor:pointer}.status{margin:14px 0 0;color:#466075;font-weight:700}.footer{margin-top:14px;color:#5b7184;font-size:12px}@media(max-width:700px){.shell{padding:12px}h1{font-size:23px}.tools button{flex:1 1 150px}}</style></head><body><main class="shell"><header><h1>Mover números — Nice ROAD</h1><p>Editor interno para colocar los principales kits sobre el despiece ROAD.</p></header><section class="panel"><div class="tools"><label for="partNumber">Kit que desea mover</label><select id="partNumber"></select><button id="reset" type="button" class="danger">Restablecer posiciones</button><button id="apply" type="button">Guardar y ver diagrama</button></div><p class="help"><strong>Uso:</strong> elija una referencia y toque su ubicación correcta. Al terminar, presione <strong>Guardar y ver diagrama</strong>.</p><div class="canvas"><div class="stage" id="stage"><img src="./nice-road-despiece.png" alt="Despiece Nice ROAD para ajustar"/></div></div><p class="status" id="status" aria-live="polite"></p><p class="footer">Los ajustes se guardan solamente en este navegador y no modifican inventario ni reportes.</p></section></main><script>const storageKey='mg_nice_road_marker_layout_v1',keys=['housing','transmission','releaseHandle','releaseLock','covers','accessories','motor','limit','releasePivot','handleScrew','pinionCap','boardSupport','washer','screw'],refs=['1','2','3','5','6','7','9','14','30','31','35','40','50','60'],labels=['Cárter principal','Grupo transmisión','Manija desbloqueo','Cerradura desbloqueo','Kit cubiertas','Kit accesorios','Grupo motor','Final de carrera','Pivote desbloqueo','Tornillo manija','Tapón piñón','Soporte de tarjeta','Arandela dentada','Tornillo 4,2×50'],defaults=[[315,275],[511,121],[165,348],[169,408],[145,110],[346,333],[394,58],[150,318],[214,390],[212,411],[422,275],[155,252],[469,165],[191,121]];const stage=document.getElementById('stage'),select=document.getElementById('partNumber'),status=document.getElementById('status'),state=(()=>{try{const s=JSON.parse(localStorage.getItem(storageKey)||'{}');return{markers:{...s.markers}}}catch(_){return{markers:{}}}})();labels.forEach((label,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${refs[i]} · ${label}`;select.append(o)});function current(i){return state.markers[keys[i]]||{x:defaults[i][0],y:defaults[i][1]}}function render(){stage.querySelectorAll('.marker').forEach(e=>e.remove());keys.forEach((key,i)=>{const p=current(i),m=document.createElement('button');m.className='marker';m.type='button';m.style.left=`${p.x/635*100}%`;m.style.top=`${p.y/463*100}%`;m.textContent=refs[i];m.setAttribute('aria-label',`Referencia ${refs[i]}`);stage.append(m)})}stage.addEventListener('pointerdown',e=>{if(e.target.classList.contains('marker'))return;const r=stage.getBoundingClientRect(),i=Number(select.value);state.markers[keys[i]]={x:Math.max(0,Math.min(635,(e.clientX-r.left)*635/r.width)),y:Math.max(0,Math.min(463,(e.clientY-r.top)*463/r.height))};localStorage.setItem(storageKey,JSON.stringify(state));render();status.textContent=`Referencia ${refs[i]} colocada. Elija otra o presione Guardar y ver diagrama.`});document.getElementById('reset').addEventListener('click',()=>{state.markers={};localStorage.setItem(storageKey,JSON.stringify(state));render();status.textContent='Las referencias volvieron a las posiciones iniciales.'});document.getElementById('apply').addEventListener('click',()=>location.href='./index.html?ajustado=1'+(new URLSearchParams(location.search).get('vista')==='diagrama'?'&vista=diagrama':''));render();status.textContent='Elija una referencia y toque el kit correcto.';</script></body></html>
